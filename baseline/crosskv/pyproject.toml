[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xmodel-kv"
version = "0.1.0"
description = "Independent reproduction of closed-form cross-model KV cache transfer"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["kv-cache", "llm-inference", "model-switching", "pytorch", "transformers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate>=1.1",
  "numpy>=1.26",
  "pyarrow>=16",
  "safetensors>=0.4",
  "torch>=2.4",
  "tqdm>=4.66",
  "transformers>=4.51,<5",
]

[project.optional-dependencies]
test = ["pytest>=8"]
evaluation = [
    "lm-eval[hf]>=0.4.12",
]

[project.urls]
Homepage = "https://github.com/forlight123/CrossKV"
Repository = "https://github.com/forlight123/CrossKV"
Issues = "https://github.com/forlight123/CrossKV/issues"

[project.scripts]
xkv-prepare = "xmodel_kv.cli.prepare:main"
xkv-extract = "xmodel_kv.cli.extract:main"
xkv-select = "xmodel_kv.cli.select:main"
xkv-fit = "xmodel_kv.cli.fit:main"
xkv-verify = "xmodel_kv.cli.verify:main"
xkv-hellaswag = "xmodel_kv.cli.hellaswag:main"
xkv-summarize-hellaswag = "xmodel_kv.cli.summarize_hellaswag:main"
xkv-benchmark = "xmodel_kv.cli.benchmark:main"
xkv-summarize-benchmark = "xmodel_kv.cli.summarize_benchmark:main"
xkv-coqa = "xmodel_kv.cli.coqa:main"
xkv-summarize-coqa = "xmodel_kv.cli.summarize_coqa:main"
xkv-policy-imprinting = "xmodel_kv.cli.policy_imprinting:main"
